<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ADFFF"/>
      <stop offset="1" stop-color="#3E9BE8"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#FFE38A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE3FF"/>
    </linearGradient>
    <linearGradient id="dropFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED4FF"/>
      <stop offset="1" stop-color="#4EA8F0"/>
    </linearGradient>
    <filter id="cloudShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E5AA0" flood-opacity="0.25"/>
    </filter>
    <filter id="sunShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C77800" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#gloss)"/>

  <!-- sun glow -->
  <circle cx="262" cy="186" r="150" fill="url(#halo)"/>

  <!-- sun rays -->
  <g stroke="#FFC940" stroke-width="15" stroke-linecap="round">
    <line x1="366" y1="186" x2="396" y2="186"/>
    <line x1="336" y1="113" x2="357" y2="91"/>
    <line x1="262" y1="82"  x2="262" y2="52"/>
    <line x1="188" y1="113" x2="167" y2="91"/>
    <line x1="158" y1="186" x2="128" y2="186"/>
    <line x1="188" y1="259" x2="167" y2="281"/>
    <line x1="262" y1="290" x2="262" y2="320"/>
    <line x1="336" y1="259" x2="357" y2="281"/>
  </g>

  <!-- rainbow, tucked behind the sun and cloud -->
  <g fill="none" stroke-linecap="round">
    <path d="M42,309 A128,128 0 0 1 224,204" stroke="#FF8A75" stroke-width="16"/>
    <path d="M58,310 A112,112 0 0 1 217,216" stroke="#FFC94E" stroke-width="16"/>
    <path d="M74,312 A96,96 0 0 1 211,229"  stroke="#7BE3A5" stroke-width="16"/>
    <path d="M90,313 A80,80 0 0 1 204,248"  stroke="#5FB8F5" stroke-width="16"/>
  </g>
  <!-- small puff where the rainbow appears from -->
  <g fill="#EAF7FF">
    <circle cx="44" cy="318" r="17"/>
    <circle cx="66" cy="308" r="13"/>
  </g>

  <!-- sun -->
  <g filter="url(#sunShadow)">
    <circle cx="262" cy="186" r="84" fill="url(#sunFill)"/>
  </g>
  <circle cx="234" cy="172" r="9" fill="#B45309"/>
  <circle cx="290" cy="172" r="9" fill="#B45309"/>
  <path d="M232,200 Q262,228 292,200" fill="none" stroke="#B45309" stroke-width="9" stroke-linecap="round"/>
  <circle cx="214" cy="196" r="11" fill="#FF9F45" opacity="0.5"/>
  <circle cx="310" cy="196" r="11" fill="#FF9F45" opacity="0.5"/>

  <!-- cloud -->
  <g filter="url(#cloudShadow)">
    <circle cx="196" cy="304" r="50" fill="url(#cloudFill)"/>
    <circle cx="258" cy="278" r="66" fill="url(#cloudFill)"/>
    <circle cx="320" cy="304" r="50" fill="url(#cloudFill)"/>
    <rect x="146" y="300" width="224" height="56" rx="28" fill="url(#cloudFill)"/>
  </g>

  <!-- raindrops -->
  <g fill="url(#dropFill)">
    <path transform="translate(206,408)"  d="M0,-16 C9,-5 14,2 14,9 A14,14 0 1,1 -14,9 C-14,2 -9,-5 0,-16 Z"/>
    <path transform="translate(258,442)"  d="M0,-16 C9,-5 14,2 14,9 A14,14 0 1,1 -14,9 C-14,2 -9,-5 0,-16 Z"/>
    <path transform="translate(310,408)" d="M0,-16 C9,-5 14,2 14,9 A14,14 0 1,1 -14,9 C-14,2 -9,-5 0,-16 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="201" cy="412" rx="3.5" ry="5"/>
    <ellipse cx="253" cy="446" rx="3.5" ry="5"/>
    <ellipse cx="305" cy="412" rx="3.5" ry="5"/>
  </g>
</svg>
