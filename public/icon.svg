<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="World Weather">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2ecff"/>
      <stop offset="1" stop-color="#8ec9f5"/>
    </linearGradient>
    <radialGradient id="sunBody" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.65" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="cloudBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8edfd"/>
    </linearGradient>
    <linearGradient id="dropBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- smiling sun peeking over the cloud -->
    <circle cx="256" cy="192" r="112" fill="#fde047" opacity="0.3"/>
    <g fill="#fbbf24">
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(0 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(45 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(90 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(135 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(180 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(225 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(270 256 192)"/>
      <rect x="247" y="62" width="18" height="36" rx="9" transform="rotate(315 256 192)"/>
    </g>
    <circle cx="256" cy="192" r="80" fill="url(#sunBody)"/>
    <circle cx="230" cy="184" r="8" fill="#92400e"/>
    <circle cx="282" cy="184" r="8" fill="#92400e"/>
    <path d="M230 204 Q256 228 282 204" fill="none" stroke="#92400e" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="216" cy="200" rx="11" ry="7" fill="#fb923c" opacity="0.6"/>
    <ellipse cx="296" cy="200" rx="11" ry="7" fill="#fb923c" opacity="0.6"/>

    <!-- small rainbow arc below -->
    <g fill="none" stroke-linecap="round">
      <path d="M194 480 A62 62 0 0 1 318 480" stroke="#fb7185" stroke-width="12"/>
      <path d="M208 480 A48 48 0 0 1 304 480" stroke="#fbbf24" stroke-width="12"/>
      <path d="M222 480 A34 34 0 0 1 290 480" stroke="#38bdf8" stroke-width="12"/>
    </g>

    <!-- fluffy cloud in front of the sun -->
    <ellipse cx="256" cy="342" rx="102" ry="11" fill="#4f8fc7" opacity="0.15"/>
    <g fill="url(#cloudBody)">
      <rect x="152" y="282" width="208" height="56" rx="28"/>
      <circle cx="198" cy="296" r="40"/>
      <circle cx="260" cy="278" r="54"/>
      <circle cx="318" cy="298" r="38"/>
    </g>

    <!-- raindrops falling from the cloud -->
    <g fill="url(#dropBody)">
      <path d="M0 -17 C5 -8 12 -1 12 7 A12 12 0 1 1 -12 7 C-12 -1 -5 -8 0 -17 Z" transform="translate(196 362)"/>
      <path d="M0 -17 C5 -8 12 -1 12 7 A12 12 0 1 1 -12 7 C-12 -1 -5 -8 0 -17 Z" transform="translate(316 374)"/>
    </g>
  </g>
</svg>